schema_version = 1

[server]
# The MicroK8s ingress reaches this private host listener. Do not expose it in
# the AWS Security Group.
host = "0.0.0.0"
port = 8080

[storage]
database = "/var/lib/fortify-lab-manager/history.sqlite3"

[authentication]
accounts = "/var/lib/fortify-lab-manager/accounts.json"

[cluster]
server = "https://127.0.0.1:16443"
namespace = "fortify"
token_file = "/var/lib/fortify-lab-manager/cluster-access/token"
ca_file = "/var/lib/fortify-lab-manager/cluster-access/ca.crt"
timeout_seconds = 5
# Optional protected local service that owns application/database credentials
# and returns only versioned, sanitized functional health results.
health_probe_socket = "/run/fortify-lab-manager/health-probe.sock"

[lifecycle]
# Fail closed unless the dedicated lifecycle ServiceAccount, protected
# kubeconfig, authorization stores, and functional probe have been provisioned.
enabled = false

[recovery]
# The protected helper owns database credentials, SSC secret.key access, and
# destination paths. The Manager receives only checksums and sanitized evidence.
enabled = false
helper_socket = "/run/fortify-lab-manager/recovery-helper.sock"
destination_id = "primary"
destination_class = "local-protected"
retention_days = 30
timeout_seconds = 3600

[supervisor]
repository = "treisland/fortifylab"
milestone = "0.1 — Evaluation Foundation"
# Optional ordered authorization boundary for Telegram-approved rollover.
# Values must match existing GitHub milestone titles exactly.
milestones = [
  "0.1 — Evaluation Foundation",
  "0.2 — Observable Manager MVP",
  "0.3 — Controlled Operations",
]
poll_seconds = 120
approval_ttl_seconds = 3600

# Runtime files remain outside the checkout.
state_file = "/home/ubuntu/.local/share/fortify-lab-manager/supervisor.db"
telegram_token_file = "/home/ubuntu/.config/fortify-lab-manager/telegram/bot-token"
telegram_user_file = "/home/ubuntu/.config/fortify-lab-manager/telegram/allowed-user-id"
telegram_chat_file = "/home/ubuntu/.config/fortify-lab-manager/telegram/private-chat-id"

# Optional bounded Codex runner. The selected issue number is appended as the
# final argument. Keep commented until the supervisor-only loop is verified.
# runner_command = ["/home/ubuntu/.local/bin/fortify-issue-dispatch"]
# heartbeat_root = "/home/ubuntu/.local/share/fortify-lab-manager/runner-heartbeats"

# Stop is hidden unless a separately reviewed, fixed executable is configured.
# The issue number is appended as its only user-derived argument. Telegram
# still requires a second, identity-bound confirmation.
# runner_stop_command = ["/home/ubuntu/.local/bin/fortify-issue-stop"]

[notifications]
# "all" delivers actionable events immediately outside quiet hours.
# "failures" rolls non-failure events into the daily digest.
mode = "all"
timezone = "UTC"
quiet_start = "22:00"
quiet_end = "07:00"
digest_hour = 8
digest_minute = 0

# Retry is offered only for stages whose implementation is independently
# verified as idempotent. An empty list is the fail-closed default.
retry_stages = []
rejection_reasons = [
  "changes-required",
  "security-concern",
  "tests-incomplete",
  "out-of-scope",
]

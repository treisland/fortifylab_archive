apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortify-manager-lifecycle
  namespace: fortify
---
apiVersion: v1
kind: Secret
metadata:
  name: fortify-manager-lifecycle-token
  namespace: fortify
  annotations:
    kubernetes.io/service-account.name: fortify-manager-lifecycle
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fortify-manager-lifecycle
  namespace: fortify
rules:
  # Helm release records use ConfigMaps so lifecycle credentials never need
  # permission to read Kubernetes Secret values.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fortify-manager-lifecycle
  namespace: fortify
subjects:
  - kind: ServiceAccount
    name: fortify-manager-lifecycle
    namespace: fortify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fortify-manager-lifecycle

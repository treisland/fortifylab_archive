name: Feature request
description: Propose a verifiable capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe how the result can be verified.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security, migration, and rollback considerations
  - type: textarea
    id: docs
    attributes:
      label: Documentation impact

name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: Describe the failure and sanitized evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include manager/profile versions and MicroK8s details. Do not include secrets or licenses.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide safe, repeatable steps.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and dependencies
      description: Identify root cause if known and affected downstream components.

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Fortify Lab Manager sign-in</title><desc id="desc">Dark local sign-in card for the read-only lab dashboard.</desc>
  <rect width="1000" height="700" fill="#07100e"/><circle cx="800" cy="0" r="420" fill="#12342b"/>
  <rect x="285" y="90" width="430" height="520" rx="18" fill="#101c19" stroke="#294039"/>
  <text x="335" y="145" fill="#60e6b2" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="3">FORTIFY LAB MANAGER</text>
  <text x="335" y="195" fill="#f2f6f4" font-family="sans-serif" font-size="34" font-weight="700">See the whole lab.</text>
  <text x="335" y="230" fill="#9bada7" font-family="sans-serif" font-size="14">Sign in with the local account bootstrapped</text><text x="335" y="252" fill="#9bada7" font-family="sans-serif" font-size="14">by your lab operator.</text>
  <text x="335" y="302" fill="#f2f6f4" font-family="sans-serif" font-size="13" font-weight="700">Username</text><rect x="335" y="315" width="330" height="48" rx="7" fill="#09120f" stroke="#3b534c"/>
  <text x="335" y="402" fill="#f2f6f4" font-family="sans-serif" font-size="13" font-weight="700">Password</text><rect x="335" y="415" width="330" height="48" rx="7" fill="#09120f" stroke="#3b534c"/>
  <rect x="335" y="490" width="330" height="50" rx="7" fill="#60e6b2"/><text x="475" y="521" fill="#06110d" font-family="sans-serif" font-size="15" font-weight="700">Sign in</text>
  <text x="335" y="575" fill="#9bada7" font-family="sans-serif" font-size="11">Read-only · Same-origin session · No cluster credentials in browser</text>
</svg>
